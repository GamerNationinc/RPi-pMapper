# nebula-cam configuration
# Lives at /boot/firmware/nebula-cam.toml - editable from any machine with an
# SD card reader. No SSH, no Linux required. Service restart applies changes.

[link]
device = "/dev/ttyAMA0"     # PL011 UART -> MicoAir743 TELEM2
baud = 921600
source_system = 1           # same sysid as the FC (we are one of its components)
source_component = 191      # MAV_COMP_ID_ONBOARD_COMPUTER
stream_rate_hz = 10

[camera]
width = 4608                # IMX708 full frame. Drop to 2304x1296 if the
height = 2592               # writer can't keep up with your trigger rate.
jpeg_quality = 92
lens_position = 0.0         # 0.0 = infinity. Do NOT enable autofocus in flight.
max_shutter_us = 1000       # 1/1000 s blur ceiling. See README for the maths.
max_analogue_gain = 8.0
ae_settle_s = 2.0
exposure_midpoint = true    # tag the middle of the exposure, not the start

# Residual correction, milliseconds, applied on top of SensorTimestamp.
# Positive = the true exposure happened later than we think.
# Leave at 0 until you have run the bench calibration in the README.
extra_latency_ms = 0.0

[storage]
root = "/data/flights"
min_free_mb = 512           # below this, refuse to open a new flight session

[mission]
# The flight controller should own the trigger via CAM_TRIGG_DIST.
# This is only a safety net if CAMERA_FEEDBACK never arrives.
fallback_trigger_dist_m = 0.0
fallback_after_s = 20.0

[system]
set_clock_from_gps = true
status_period_s = 5.0

[telemetry]
# Serial <-> UDP MAVLink bridge so a GCS on the WiFi (laptop or Deck) sees the
# vehicle. QGC autoconnects on 14550. The FC's own radio never routes through
# the Pi - this is a second path, not a replacement.
udp_enabled = true
udp_port = 14550

[status]
# Live snapshot for nebula-top and the phone/laptop page. tmpfs only.
file = "/run/nebula-cam/status.json"
http_port = 8080            # http://nebula-cam.local:8080/   (0 = off)

[wifi]
# Applied at boot by nebula-wifi.service. Highest priority in range wins.
# Anyone with the SD card can read these; use hotspot passwords you don't
# care about.
band = "bg"                 # lock to 2.4 GHz - range beats throughput in the field
networks = [
  { ssid = "NEBULA-GCS",     psk = "changeme", priority = 20 },   # Steam Deck hotspot
  { ssid = "NEBULA-LAPTOP",  psk = "changeme", priority = 10 },   # laptop hotspot
]
# If nothing above is in range after fallback_after_s, host our own AP so the
# Pi is always reachable: join it, then http://10.42.0.1:8080/
fallback_ap = true
fallback_ap_ssid = "NEBULA-CAM"
fallback_ap_psk = "nebulacam"
fallback_after_s = 45
